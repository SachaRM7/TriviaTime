<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivial Time - Lobby</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; text-align: center; padding: 20px; }
        .player-row { margin: 10px 0; }
        input { padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Trivial Time</h1>
    <h3>Configuration de la partie</h3>
    
    <form action="/setup" method="POST">
        <div id="players-container">
            <div class="player-row">
                <input type="text" name="name" placeholder="Nom Joueur 1" required>
                <input type="number" name="age" placeholder="Age" required style="width: 60px;">
            </div>
            <div class="player-row">
                <input type="text" name="name" placeholder="Nom Joueur 2" required>
                <input type="number" name="age" placeholder="Age" required style="width: 60px;">
            </div>
        </div>
        
        <button type="button" onclick="addPlayer()">+ Ajouter un joueur</button>
        <br><br>
        <button type="submit">LANCER LA PARTIE</button>
    </form>

    <script>
        function addPlayer() {
            const div = document.createElement('div');
            div.className = 'player-row';
            div.innerHTML = `
                <input type="text" name="name" placeholder="Nom Joueur" required>
                <input type="number" name="age" placeholder="Age" required style="width: 60px;">
            `;
            document.getElementById('players-container').appendChild(div);
        }
    </script>
</body>
</html>
